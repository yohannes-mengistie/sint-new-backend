services:
  postgres:
    image: postgres:16-alpine
    container_name: sint_new_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sint_new
      POSTGRES_USER: sint_new
      POSTGRES_PASSWORD: sint_new_dev_password
    ports:
      - "5433:5432"
    volumes:
      - sint_new_postgres_data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sint_new -d sint_new"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sint_new_postgres_data:
